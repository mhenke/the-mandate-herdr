    - strong [ref=e4]: Browser-level shortcuts may never reach this page.
    - text: Ctrl+W, Ctrl+T, Ctrl+N, Ctrl+Tab, Alt+Tab, Cmd+Q and similar are handled by the browser or OS before any page listener runs. Their absence from the log
    - emphasis [ref=e5]: is the signal
    - text: ": record the chord as intercepted and note what actually happened."
    - strong [ref=e6]: Test in a disposable window.
    - text: Expect Ctrl+W to close this tab. Do not worry about losing state; that is one of the results. This page cannot test browser-chrome interception, only what a page-level
    - code [ref=e7]: keydown
