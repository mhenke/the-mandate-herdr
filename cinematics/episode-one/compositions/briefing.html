  <script>
    (function () {
      const canvas = document.querySelector("#window-rain");
      const ctx = canvas.getContext("2d");
      let seed = 4421;
      function rand() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // Exterior rain streaks strictly on the window glass (60 drops)
      // Horizontal bounds: x = 920 to 1710 (clear of desk lamp on left, clear of wall/mullion on right)
      const DROPS_EXT = [];
      for (let i = 0; i < 60; i++) {
        DROPS_EXT.push({
          x: 920 + rand() * (1710 - 920),
          y: rand() * 200,
          len: 22 + rand() * 28,
          speed: 650 + rand() * 350,
          alpha: 0.18 + rand() * 0.22,
          drift: 20 + rand() * 20,
        });
      }

      // Condensation trickles on the window pane overlooking the Capitol dome (14 trails)
      const TRICKLES = [];
      for (let i = 0; i < 14; i++) {
        TRICKLES.push({
          x: 1050 + rand() * (1700 - 1050),
          y: rand() * 190,
          len: 18 + rand() * 28,
          speed: 40 + rand() * 60,
          radius: 1.2 + rand() * 1.2,
          alpha: 0.25 + rand() * 0.35,
        });
      }

      function drawWindowRain(t) {
        ctx.clearRect(0, 0, 1920, 1080);
        ctx.save();

        // Strict geometric clip to physical window glass:
        // Sky over Capitol dome strictly above dispatch card (y <= 210, x: 1100..1710)
        // Never inside room, never over dispatch card or header, never over laptop or desk
        ctx.beginPath();
        ctx.rect(1100, 0, 610, 210);
        ctx.clip();

        ctx.lineCap = "round";

        // Draw exterior falling rain streaks
        ctx.lineWidth = 1.3;
        for (const d of DROPS_EXT) {
          const y = ((d.y + t * d.speed) % 240) - 30;
          const x = ((d.x + t * d.drift - 920) % (1710 - 920)) + 920;

          let a = d.alpha;
          if (x < 960) a *= (x - 920) / 40;
          if (x > 1670) a *= (1710 - x) / 40;

          ctx.strokeStyle = "rgba(180, 215, 240, " + a + ")";
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + d.drift * 0.03, y + d.len);
          ctx.stroke();
        }

        // Draw window glass condensation trickles (droplet head + wet trail)
        for (const tr of TRICKLES) {
          const y = (tr.y + t * tr.speed) % 220;
          const x = tr.x + Math.sin(y * 0.05) * 2;

          let a = tr.alpha;
          if (y < 30) a *= y / 30;

          // Trail streak
          const grad = ctx.createLinearGradient(x, y - tr.len, x, y);
          grad.addColorStop(0, "rgba(190, 220, 245, 0)");
          grad.addColorStop(1, "rgba(190, 220, 245, " + a * 0.75 + ")");
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(x, y - tr.len);
          ctx.lineTo(x, y);
          ctx.stroke();

          // Droplet head bead
          ctx.fillStyle = "rgba(220, 240, 255, " + a + ")";
          ctx.beginPath();
          ctx.arc(x, y, tr.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      const tl = gsap.timeline({
        paused: true,
        onUpdate: function () {
          drawWindowRain(tl.time());
        },
      });
      // Desk plate: rock-solid locked camera (zero pan, zero zoom wobble)
      // Header fades in calmly in place
      tl.fromTo("#head", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.15);
      // Envelope: calm fade in place (zero sliding, zero hopping)
      tl.fromTo(
        "#envelope",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        0.35,
      );
      // Stationary Reading Hold: from 0.9s to 6.2s (5.3s hold on full card)
      // Clean fade to black: entire stage dims uniformly (no flash)
      tl.to("#root", { opacity: 0, duration: 0.28, ease: "power1.in" }, 6.22);
      window.__timelines["scene-briefing"] = tl;
    })();
  </script>
