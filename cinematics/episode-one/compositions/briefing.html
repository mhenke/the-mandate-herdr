  </style>
  <div id="root" data-composition-id="scene-briefing" data-width="1920" data-height="1080">
    <div id="camera-b">
      <img
        id="plate-b"
        class="plate"
        src="assets/cooperative-desk.webp"
        alt=""
        data-layout-ignore
      />

    </div>
    <div id="head" class="clip" data-start="0.15" data-duration="6.35">

    </div>
    <div id="envelope" class="envelope-card clip" data-start="0.3" data-duration="6.2" data-layout-allow-overlap data-hold>
      <div id="seal" data-layout-ignore>[&nbsp;OFF-RECORD&nbsp;//&nbsp;RESTRICTED&nbsp;]</div>
      <div class="env-from" id="env-from">
        FROM&nbsp;&nbsp;<b>JUNE ADEBAYO</b>&nbsp;<span class="dim">// EDITOR OF RECORD</span><br />
        TO&nbsp;&nbsp;&nbsp;&nbsp;<b>STRINGER ON DESK</b>&nbsp;<span class="dim">// VERIFIER CREDENTIAL ACTIVE</span>
      </div>
      <div class="env-subject" id="env-subject">A source has come forward on a vendor security incident. Confirm what is known before contact.</div>
      <div class="env-meta" id="env-meta">
        <span><span class="tag">REF</span>&nbsp;NOV 12 · 23:00 EST</span>
        <span><span class="tag">DIRECTIVE</span>&nbsp;DO NOT CONTACT SOURCE</span>
      </div>

  </div>
  <script>
    (function () {
      const canvas = document.querySelector("#window-rain");
      const ctx = canvas.getContext("2d");
      let seed = 4421;
      function rand() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // Exterior rain streaks outside in the night sky over Capitol dome (90 drops)
      // Placed strictly in the window area (x: 1000 to 1920)
      const DROPS_EXT = [];
      for (let i = 0; i < 90; i++) {
        DROPS_EXT.push({
          x: 1000 + rand() * 920,
          y: rand() * 660,
          len: 28 + rand() * 42,
          speed: 850 + rand() * 450,
          alpha: 0.14 + rand() * 0.20,
          drift: 35 + rand() * 30,
        });
      }

      // Condensation trickles running down the window glass pane (22 trails)
      // Placed strictly on the window pane overlooking the Capitol dome (x: 1250 to 1900)
      const TRICKLES = [];
      for (let i = 0; i < 22; i++) {
        TRICKLES.push({
          x: 1250 + rand() * 650,
          y: rand() * 600,
          len: 25 + rand() * 50,
          speed: 65 + rand() * 85,
          radius: 1.4 + rand() * 1.4,
          alpha: 0.28 + rand() * 0.38,
          drift: (rand() - 0.5) * 6,
        });
      }

      function drawWindowRain(t) {
        ctx.clearRect(0, 0, 1920, 1080);
        ctx.lineCap = "round";

        // Draw exterior falling rain streaks
        ctx.lineWidth = 1.2;
        for (const d of DROPS_EXT) {
          const y = (d.y + t * d.speed) % 680 - 40;
          const x = (d.x + t * d.drift) % (1920 - 1000 + 80) + 1000 - 40;
          // Rain is strictly OUTSIDE the window; NEVER inside the room or over the dispatch card
          if (x < 1000 || x > 1920 || y < 0 || y > 620) continue;
          if (x < 1580 && y >= 200) continue; // Skip card / desk area completely
          let a = d.alpha;
          if (x < 1080) a *= (x - 1000) / 80;
          if (y > 520) a *= (620 - y) / 100;
          ctx.strokeStyle = "rgba(180, 210, 235, " + a + ")";
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + d.drift * 0.03, y + d.len);
          ctx.stroke();
        }

        // Draw window glass trickles (droplet head + wet trail)
        for (const tr of TRICKLES) {
          const y = (tr.y + t * tr.speed) % 580;
          const x = tr.x + Math.sin(y * 0.04) * 2;
          // Glass trickles strictly on the window pane
          if (x < 1250 || x > 1900 || y < 20 || y > 560) continue;
          if (x < 1580 && y >= 200) continue; // Skip card area completely
          let a = tr.alpha;
          if (x < 1320) a *= (x - 1250) / 70;
          if (y > 480) a *= (560 - y) / 80;

          // Trail streak
          const grad = ctx.createLinearGradient(x, y - tr.len, x, y);
          grad.addColorStop(0, "rgba(190, 220, 245, 0)");
          grad.addColorStop(1, "rgba(190, 220, 245, " + (a * 0.8) + ")");
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(x, y - tr.len);
          ctx.lineTo(x, y);
          ctx.stroke();

          // Droplet head bead
          ctx.fillStyle = "rgba(220, 240, 255, " + a + ")";
          ctx.beginPath();
          ctx.arc(x, y, tr.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tl = gsap.timeline({
        paused: true,
        onUpdate: function () {
          drawWindowRain(tl.time());
        },
      });
      // Desk plate: rock-solid locked camera (zero pan, zero zoom wobble)
      // Header fades in calmly in place
      tl.fromTo(
        "#head",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power2.out" },
        0.15,
      );
      // Envelope: calm fade in place (zero sliding, zero hopping)
      tl.fromTo(
        "#envelope",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        0.35,
      );
      // Stationary Reading Hold: from 0.9s to 6.2s (5.3s hold on full card)
      // Clean fade to black: entire stage dims uniformly (no flash)
      tl.to("#root", { opacity: 0, duration: 0.28, ease: "power1.in" }, 6.22);
      window.__timelines["scene-briefing"] = tl;
    })();
  </script>
