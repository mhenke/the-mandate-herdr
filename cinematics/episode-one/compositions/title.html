    <div id="t-docket" class="clip" data-start="0.4" data-duration="6.6" data-layout-allow-overlap data-hold>
      <div class="doc-line" id="doc-l1">WASHINGTON,&nbsp;D.C.</div>
      <div class="doc-line" id="doc-l2">CAPITOL&nbsp;AVENUE&nbsp;//&nbsp;23:47&nbsp;EST</div>

  <script>
    // Deterministic procedural volumetric rain (2 depth passes, seeded PRNG)
    (function () {
      const canvas = document.querySelector("#rain");
      const ctx = canvas.getContext("2d");
      let seed = 1109;
      function rand() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      // Pass 1: Fine atmospheric background mist (120 drops)
      const DROPS_BG = [];
      for (let i = 0; i < 120; i++) {
        DROPS_BG.push({
          x: rand() * 1920,
          y: rand() * 1080,
          len: 20 + rand() * 30,
          speed: 700 + rand() * 300,
          alpha: 0.05 + rand() * 0.08,
          drift: 25 + rand() * 25,
        });
      }
      // Pass 2: Gentle foreground rainfall (20 drops)
      const DROPS_FG = [];
      for (let i = 0; i < 20; i++) {
        DROPS_FG.push({
          x: rand() * 1920,
          y: rand() * 1080,
          len: 40 + rand() * 35,
          speed: 1100 + rand() * 400,
          alpha: 0.12 + rand() * 0.10,
          drift: 35 + rand() * 30,
        });
      }
      function drawAt(t) {
        ctx.clearRect(0, 0, 1920, 1080);
        ctx.lineCap = "round";
        // Background mist: subtle and quiet
        ctx.lineWidth = 0.8;
        for (const d of DROPS_BG) {
          const y = (d.y + t * d.speed) % (1080 + 120) - 60;
          const x = (d.x + t * d.drift) % (1920 + 100) - 50;
          ctx.strokeStyle = "rgba(180, 205, 225, " + d.alpha + ")";
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + d.drift * 0.03, y + d.len);
          ctx.stroke();
        }
        // Foreground streaks: soft and understated
        ctx.lineWidth = 1.2;
        for (const d of DROPS_FG) {
          const y = (d.y + t * d.speed) % (1080 + 200) - 100;
          const x = (d.x + t * d.drift) % (1920 + 120) - 60;
          const grad = ctx.createLinearGradient(x, y, x + d.drift * 0.04, y + d.len);
          grad.addColorStop(0, "rgba(200, 225, 245, 0)");
          grad.addColorStop(0.3, "rgba(200, 225, 245, " + d.alpha + ")");
          grad.addColorStop(1, "rgba(200, 225, 245, 0)");
          ctx.strokeStyle = grad;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + d.drift * 0.04, y + d.len);
          ctx.stroke();
        }
      }
      const tl = gsap.timeline({
        paused: true,
        onUpdate: function () {
          drawAt(tl.time());
        },
      });
      // Rock-solid locked tripod camera (zero pan, zero zoom, zero shimmer)
      // Docket: calm stationary fade in place (zero sliding)
      tl.fromTo(
        "#t-docket",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        0.4,
      );
      // Title: calm fade in place (zero dropping, zero sliding)
      tl.fromTo(
        "#t-mandate",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        1.1,
      );
      tl.fromTo(
        "#t-sub",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        1.5,
      );
      // Stationary Reading Hold: from 2.0s to 6.7s (4.7s dead-still hold)
      // Clean fade to black: entire stage dims uniformly into background (no flash)
      tl.to("#root", { opacity: 0, duration: 0.28, ease: "power1.in" }, 6.72);
      window.__timelines["scene-title"] = tl;
    })();
  </script>
