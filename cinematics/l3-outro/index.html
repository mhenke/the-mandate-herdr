<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #020407;
        --ink: #f0f4f8;
        --muted: #8c9ba8;
        --accent: #89b4fa;
        --amber: #cf9b52;
        --font-display: "Oswald", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.0"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="scene-docket"
        data-composition-id="scene-docket"
        data-composition-src="compositions/docket.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-testimony"
        data-composition-id="scene-testimony"
        data-composition-src="compositions/testimony.html"
        data-start="4.5"
        data-duration="7.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-directive"
        data-composition-id="scene-directive"
        data-composition-src="compositions/directive.html"
        data-start="12.0"
        data-duration="8.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
